name: hegel-java CI

on:
  push:
    branches: [main]
    paths:
      - 'implementations/hegel-java/**'
      - '.github/workflows/ci-java.yml'
  pull_request:
    branches: [main]
    paths:
      - 'implementations/hegel-java/**'
      - '.github/workflows/ci-java.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: implementations/hegel-java

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - uses: astral-sh/setup-uv@v6

      - name: Run check (lint + test + coverage)
        run: just check

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - uses: astral-sh/setup-uv@v6

      - name: Run conformance tests
        run: just conformance
