name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
          packages: cbor

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - uses: astral-sh/setup-uv@v6

      - name: Install package dependencies
        run: raco pkg install --auto --no-docs cbor || true

      - name: Run check (coverage + lint + conformance)
        run: just check

  conformance:
    name: conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Racket
        uses: Bogdanp/setup-racket@v1.11
        with:
          version: stable
          packages: cbor

      - name: Install just
        run: sudo apt-get update && sudo apt-get install -y just

      - uses: astral-sh/setup-uv@v6

      - name: Run conformance tests
        run: just conformance
